<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A character card for a fictional character.">
    <meta name="author" content="Nefi Raul Serrano Ramirez">
    <title>Character Card</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="Character Card">
    <meta property="og:description" content="A character card for a fictional character.">
    <meta property="og:url" content="https://nefiserrano.github.io/wdd131/charactercard">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="charactercard.css">
    <script src="charactercard.js" defer></script>
</head>
<body>
    <div class="card">
        <div class="name"></div>
        <div class="stats">
            <p id="class"></p>
            <p id="level"></p>
            <p id="health"></p>
        </div>
        <div class="buttons">
            <button id="attacked">Attacked</button>
            <button id="levelUp">Level Up</button>
        </div>
    </div>
</body>
