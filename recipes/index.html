<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A collection of delicious recipes for every occasion.">
    <meta name="author" content="Nefi Raul Serrano Ramirez">
    <title>Recipe Book</title>
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book">
    <meta property="og:description" content="A collection of delicious recipes for every occasion.">
    <meta property="og:url" content="https://nefiserrano.github.io/wdd131/recipes">
    <meta property="og:image" content="images/social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Recipe Book">
    <meta name="twitter:description" content="A collection of delicious recipes for every occasion.">
    <meta name="twitter:image" content="images/social-preview-image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="stylesheet" href="recipes.css">
    <script src="recipes.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">         
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/recipe-book.png" alt="Recipe book icon">
            <h1>RecipeBook</h1>
        </div>
        <div class="search-bar">
            <label for="recipe-search" class="sr-only">Search for recipes</label>
            <input type="text" name="searchRecipe" id="recipe-search" placeholder="Find a recipe">
            <button type="submit" class="search-button">
                <img src="images/search.svg" alt="Search icon">
            </button>
        </div>
    </header>
    <main>
        <article id="recipe-container">
            
        </article>
    </main>
    <footer>                   
        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
    </footer>                             
</body>
</html>
